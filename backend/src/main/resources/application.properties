spring.application.name=salaryai-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salaryai_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway is opt-in until an existing environment has been baselined from its
# inspected schema. See db/migration/README.md. Enable with the `migration`
# profile only after that one-time, operator-controlled step.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true


spring.profiles.active=local
# Isolated PostgreSQL test database only. Never change this URL to salaryai_db.
spring.datasource.url=jdbc:postgresql://localhost:5432/salaryai_test
spring.datasource.username=salaryai_test_user
spring.datasource.password=${SALARYAI_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The test schema is owned exclusively by this profile/test database.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
